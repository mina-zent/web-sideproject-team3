# NestJS 백엔드 추가 및 pnpm 모노레포 전환

> 유형: feature · 영향 범위: 둘 다(구조 전환 + 신규 앱) · 작성일: 2026-07-08
> **상태: ✅ 확정 (2026-07-08)** — 결정 결과는 8장 참고

## 1. 개요

현재 루트에 단일 Next.js 앱만 있는 리포를 **pnpm workspace 기반 모노레포**로 전환하고,
`apps/api`에 **NestJS + TypeScript** 백엔드를 추가한 뒤, 프론트에서 백엔드 헬스체크
엔드포인트를 호출하는 **연결 테스트**까지 완료한다. 각 단계는 독립적으로 동작 가능한
상태로 **개별 커밋**한다.

PostgreSQL + Prisma는 "데이터 핸드오프 스펙은 DB 설계 시 재논의" 상태이므로,
이번 작업에서는 **연결 테스트에 필요한 범위만** 다루고 스키마 확정은 미룬다.
(로컬에 Docker가 설치되어 있지 않은 점도 고려 — 결정 포인트 4 참고)

## 2. 현재 상태

- 루트에 Next.js 16.2.9 (App Router) 앱 1개 — `src/app/` 구조
- pnpm 10.23.0 / Node 24.14.1, `pnpm-workspace.yaml`은 존재하나 `packages` 필드 없음
  (빌드 허용 목록만 있음 → 사실상 단일 패키지)
- 백엔드 없음, Docker 미설치

## 3. 목표 구조

```
web-sideproject-team3/
├── apps/
│   ├── web/                  # 기존 Next.js 앱 이동 (포트 3000)
│   │   ├── src/app/
│   │   ├── next.config.ts
│   │   ├── package.json      # name: "@repo/web"
│   │   └── tsconfig.json
│   └── api/                  # 신규 NestJS 앱 (포트 4000)
│       ├── src/
│       │   ├── main.ts
│       │   ├── app.module.ts
│       │   └── health/       # 헬스체크 모듈
│       ├── package.json      # name: "@repo/api"
│       └── tsconfig.json
├── packages/                 # (이번 단계에서는 빈 폴더만 예약, 추후 공유 타입/Prisma)
├── plans/
├── pnpm-workspace.yaml       # packages: ["apps/*", "packages/*"]
├── package.json              # 루트 — 워크스페이스 오케스트레이션 스크립트만
└── CLAUDE.md
```

## 4. 단계별 작업 계획 (커밋 단위)

### 커밋 1 — `chore: pnpm 워크스페이스 모노레포 구조로 전환`

- `apps/web/` 생성 후 기존 Next 앱 파일 이동
  (`src/`, `public/`, `next.config.ts`, `tsconfig.json`, `eslint.config.mjs` 등)
- `pnpm-workspace.yaml`에 `packages: ["apps/*", "packages/*"]` 추가
- 루트 `package.json`을 워크스페이스 루트로 정리, 앱 `package.json`은 `@repo/web`으로 개명
- 루트 스크립트 추가: `dev:web`, `build`, `lint`, `format` (`pnpm --filter` 사용)
- **검증**: `pnpm install` 후 `pnpm dev:web` → http://localhost:3000 기존 화면 정상

### 커밋 2 — `feat: NestJS 백엔드(apps/api) 스캐폴드 추가`

- `apps/api`에 NestJS 최신 안정판 수동 스캐폴드
  (`@nestjs/core`, `@nestjs/common`, `@nestjs/platform-express`)
  — Nest CLI 전역 설치 대신 워크스페이스 내 devDependency로 관리
- 전역 프리픽스 `/api`, 포트 **4000** (`PORT` 환경변수로 오버라이드 가능)
- `GET /api/health` → `{ status: 'ok', service: 'api', timestamp }` 반환하는 `HealthModule`
- 리포 공통 컨벤션 적용: 2칸 들여쓰기, `any` 금지, 한국어 주석, console 규칙
  (단, 모듈/DI 등 구조는 NestJS 관례를 따름 — 리스크 6.3 참고)
- 루트 스크립트 추가: `dev:api`, `dev` (web+api 병렬 실행)
- **검증**: `pnpm dev:api` 후 `curl http://localhost:4000/api/health` → 200 OK

### 커밋 3 — `feat: 프론트-백엔드 연결 및 헬스체크 표시`

- 연결 방식은 **결정 포인트 3**에 따름 (추천: 서버 컴포넌트에서 직접 fetch)
- `apps/web/src/app/page.tsx`(또는 별도 섹션 컴포넌트)에서 `/api/health` 호출 결과 표시
  - API URL은 `API_BASE_URL` 상수(환경변수 기반)로 추출, `cache: 'no-store'`로 항상 신선한 응답
  - 백엔드 미기동 시에도 프론트가 죽지 않도록 실패 시 "연결 안 됨" 상태 렌더링
- **검증(연결 테스트)**:
  1. `pnpm dev` (web 3000 + api 4000 동시 기동)
  2. 브라우저에서 http://localhost:3000 접속 → "API 연결됨 (status: ok)" 표시 확인
  3. api 프로세스 종료 후 새로고침 → "API 연결 안 됨" 표시 확인 (그레이스풀 실패)

### 커밋 4 (선택) — `chore: PostgreSQL + Prisma 초기 세팅`

- **결정 포인트 4**에서 "포함"을 선택한 경우에만 진행
- `docker-compose.yml`(PostgreSQL 16) + `apps/api`에 Prisma 도입
- 스키마는 `HealthCheck` 더미 모델 1개만 — 실제 도메인 스키마는 DB 설계 논의 후 확정
- `/api/health`에 DB 연결 상태(`db: 'ok' | 'down'`) 필드 추가
- **검증**: `docker compose up -d` → `pnpm --filter @repo/api prisma migrate dev` → 헬스체크에 `db: ok`

## 5. 연결 테스트 절차 요약

| 순서 | 명령/행동 | 기대 결과 |
| --- | --- | --- |
| 1 | `pnpm install` | 워크스페이스 전체 의존성 설치 성공 |
| 2 | `pnpm dev:api` | 4000 포트 기동, 콘솔에 기동 로그 |
| 3 | `curl localhost:4000/api/health` | `{"status":"ok",...}` |
| 4 | `pnpm dev` (별도 터미널이면 `dev:web`) | web 3000 + api 4000 동시 기동 |
| 5 | 브라우저 http://localhost:3000 | 페이지에 API 연결 상태 "ok" 표시 |
| 6 | api 종료 후 새로고침 | "연결 안 됨" 표시, 프론트는 정상 렌더 |

## 6. 리스크 및 주의사항

1. **파일 이동으로 인한 대량 diff**: 커밋 1은 이동(rename)만 포함하고 코드 수정은 섞지
   않는다 — `git mv`로 이력 보존.
2. **포트 충돌**: api 기본 4000, 사용 중이면 `PORT`로 변경.
3. **컨벤션 충돌**: CLAUDE.md는 `type` 선호/클래스 최소화 성향이지만 NestJS는
   클래스+데코레이터 기반. **백엔드는 Nest 관례(클래스, 모듈, DI)를 우선**하되
   들여쓰기·`any` 금지·console 규칙·한국어 주석 등 공통 룰은 그대로 적용한다.
4. **Docker 미설치**: 커밋 4를 포함하려면 Docker Desktop(또는 OrbStack) 설치가 선행돼야
   한다. 미설치 상태면 커밋 4는 후속 작업으로 미룬다.
5. **팀원 브랜치 충돌**: 커밋 1의 디렉토리 이동은 진행 중인 다른 브랜치와 충돌 가능성이
   크다 — 팀에 공지 후 빠르게 머지하는 것을 권장.

## 7. 검증 체크리스트

- [ ] `pnpm install` 클린 설치 성공
- [ ] `pnpm dev:web` → 기존 Next 화면 정상 (구조 이동 후 회귀 없음)
- [ ] `pnpm dev:api` → `GET /api/health` 200
- [ ] `pnpm dev` → 프론트 페이지에서 API 연결 상태 확인
- [ ] `pnpm lint` 통과 (web, api 모두)
- [ ] 커밋이 단계별로 분리되어 있고 각 커밋 시점에 빌드 가능

## 8. 결정 포인트 (✅ 확정)

| # | 결정 | 확정 결과 |
| --- | --- | --- |
| 1 | 백엔드 시작 방식 | **NestJS 분리로 바로 시작** |
| 2 | 리포 구조 | **apps/web + apps/api로 이동** |
| 3 | 프론트→백엔드 연결 방식 | **서버 컴포넌트에서 직접 fetch** |
| 4 | DB(PostgreSQL + Prisma) 포함 범위 | **이번 작업에서는 제외** (커밋 4는 후속 작업) |

### 결정 배경 Q&A

**Q. 프론트/백엔드 코드를 `apps/` 하위에 두는 이유는? (백엔드까지 `apps/`에 두는 게 일반적인가?)**

- **일반 관례 맞음 (검증 완료)**: 구분 기준은 "프론트냐 백엔드냐"가 아니라 **"실행되는
  앱이냐, 공유 라이브러리냐"**다. `apps/` = 배포/실행 단위(프론트·백엔드·모바일 모두),
  `packages/` = 공유 코드(타입·UI·설정 등).
  - Vercel 공식 Turborepo 예제 `with-nestjs`가 정확히 `apps/api`(NestJS) +
    `apps/web`(Next.js) 구조 — https://github.com/vercel/turborepo/tree/main/examples/with-nestjs
  - pnpm 공식 workspace 문서 및 커뮤니티 가이드도 동일 구분 — https://pnpm.io/workspaces
- 추후 FE·BE가 공유할 타입 패키지가 생기면 `packages/shared`로 자연스럽게 확장된다.
- 루트에 `web/`, `api/`를 평평하게 두는 대안도 동작은 하지만, 앱·공유 패키지가 늘어나는
  순간 루트가 비대해지고 워크스페이스 glob(`apps/*`)의 이점을 잃는다.

**Q. 백엔드 프로젝트명을 `api`로 단순화해도 되나?**

- 가능하며 그렇게 확정. 디렉토리는 `apps/api`, 패키지명은 `@repo/api`.
  `backend`, `server`보다 `api`가 관례적으로 더 흔하고 경로만으로 역할이 명확하다.

  .section-title { font-size: 13px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; margin: 0 0 12px 2px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .card.unresolved { border-color: #fcd34d; }
  .card.confirmed { border-color: var(--good-border); background: #fcfdfc; }
  .card-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .card-title { font-size: 16px; font-weight: 700; margin: 0; }
  .card-desc { color: var(--muted); font-size: 14px; margin: 4px 0 16px; }
  .pick-tag { font-size:11px; font-weight:700; color:var(--muted); white-space:nowrap;
    border:1px solid var(--border); border-radius:999px; padding:2px 9px; }
  .pick-tag.done { color:var(--good); border-color:var(--good-border); background:var(--good-weak); }

  .options { display: flex; flex-direction: column; gap: 8px; }
  .option {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px;
    cursor: pointer; transition: border-color .12s, background .12s;
    background: #fff;
  }
  .option:hover { border-color: #cbd5e1; background: #f8fafc; }
  .option.selected { border-color: var(--primary); background: var(--primary-weak); }
  .option .marker {
    flex: none; width: 20px; height: 20px; margin-top: 1px;
    border: 2px solid #cbd5e1; background:#fff; display:grid; place-items:center;
  }
  .option[data-type="single"] .marker { border-radius: 50%; }
  .option[data-type="multi"] .marker { border-radius: 6px; }
  .option.selected .marker { border-color: var(--primary); background: var(--primary); }
  .option.selected .marker::after {
    content: ''; width: 8px; height: 8px; background:#fff; border-radius:2px;
  }
  .option[data-type="single"].selected .marker::after { border-radius: 50%; }
  .option .opt-body { flex: 1; }
  .opt-label { font-weight: 600; font-size: 14.5px; }
  .opt-label .rec { font-size:11px; font-weight:700; color:var(--good); margin-left:6px;
    background:var(--good-weak); border:1px solid var(--good-border); padding:1px 7px; border-radius:999px; }
  .opt-desc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .custom-input { margin-top: 8px; width: 100%; border:1.5px solid var(--border);
    border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; display:none; }
  .option.selected .custom-input { display:block; }

  /* 확정(locked) 카드 — 선택된 것만 강조, 나머지는 흐리게, 클릭 비활성 */
  .card.confirmed .options { cursor: default; }
  .card.confirmed .option { cursor: default; }
  .card.confirmed .option:hover { border-color: var(--border); background: #fff; }
  .card.confirmed .option.selected { border-color: var(--good-border); background: var(--good-weak); }
  .card.confirmed .option.selected .marker { border-color: var(--good); background: var(--good); }
  .card.confirmed .option:not(.selected) { opacity: .45; }

  .notes-area { width:100%; min-height:70px; border:1.5px solid var(--border); border-radius:10px;
    padding:12px 14px; font-size:14px; font-family:inherit; resize:vertical; }

  /* 계획서 본문(.md 렌더) */
  .plan-body {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 28px 32px; box-shadow: var(--shadow); margin-top: 8px;
  }
  .plan-body h1, .plan-body h2, .plan-body h3, .plan-body h4, .plan-body h5, .plan-body h6 {
    line-height: 1.3; letter-spacing: -.01em; margin: 1.4em 0 .5em;
  }
  .plan-body > :first-child { margin-top: 0; }
  .plan-body h1 { font-size: 22px; border-bottom: 2px solid var(--border); padding-bottom: .3em; }
  .plan-body h2 { font-size: 19px; border-bottom: 1px solid var(--border); padding-bottom: .25em; }
  .plan-body h3 { font-size: 16.5px; }
  .plan-body h4 { font-size: 15px; color: #334155; }
  .plan-body p { margin: .6em 0; font-size: 14.5px; }
  .plan-body ul, .plan-body ol { margin: .5em 0; padding-left: 1.4em; font-size: 14.5px; }
  .plan-body li { margin: .25em 0; }
  .plan-body strong { font-weight: 700; color: #0f172a; }
  .plan-body code {
    background: #f1f5f9; color: #be123c; padding: 1.5px 6px; border-radius: 6px;
    font-size: 12.8px; font-family: 'SF Mono', Menlo, Consolas, monospace;
  }
  .plan-body pre.md-code {
    background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 14px 16px;
    overflow-x: auto; margin: .8em 0;
  }
  .plan-body pre.md-code code { background: none; color: inherit; padding: 0; font-size: 12.8px; }
  .plan-body blockquote {
    margin: .8em 0; padding: 8px 16px; border-left: 4px solid var(--primary-border);
    background: var(--primary-weak); color: #334155; border-radius: 0 8px 8px 0; font-size: 14px;
  }
  .plan-body hr { border: none; border-top: 1px solid var(--border); margin: 1.6em 0; }
  .plan-body a { color: var(--primary); text-decoration: none; }
  .plan-body a:hover { text-decoration: underline; }
  .plan-body table {
    border-collapse: collapse; width: 100%; margin: .9em 0; font-size: 13.5px;
    display: block; overflow-x: auto;
  }
  .plan-body th, .plan-body td { border: 1px solid var(--border); padding: 7px 11px; text-align: left; vertical-align: top; }
  .plan-body th { background: #f8fafc; font-weight: 700; white-space: nowrap; }
  .plan-body tbody tr:nth-child(even) { background: #fcfdfe; }

  /* 하단 고정 액션 바 */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border-top: 1px solid var(--border); box-shadow: 0 -2px 12px rgba(15,23,42,.06);
    padding: 14px 20px;
  }
  .actionbar-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .status { font-size: 13px; color: var(--muted); flex: 1; }
  .status b { color: var(--text); }
  button {
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    border-radius: 9px; padding: 11px 18px; border: 1px solid var(--border);
    background: #fff; color: var(--text); transition: filter .12s, background .12s;
  }
  button:hover { background: #f8fafc; }
  button.primary { background: var(--primary); color:#fff; border-color: var(--primary); }
  button.primary:hover { filter: brightness(1.06); background: var(--primary); }
  button:disabled { opacity: .5; cursor: not-allowed; }

  details.preview { margin: 8px 0 24px; }
  details.preview summary { cursor:pointer; font-size:13px; color:var(--muted); padding:6px 0; }
  pre.prompt-out {
    background:#0f172a; color:#e2e8f0; border-radius:10px; padding:16px 18px;
    font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-word;
    font-family: 'SF Mono', Menlo, Consolas, monospace; margin: 4px 0 0;
  }
  .toast {
    position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--good); color:#fff; padding: 10px 20px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; box-shadow: var(--shadow); z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="plan-head">
    <h1 id="p-title"></h1>
    <p class="plan-summary" id="p-summary"></p>
    <div class="badges">
      <span class="badge" id="p-type"></span>
      <span class="badge scope" id="p-scope"></span>
    </div>
    <a class="md-link" id="p-mdlink" href="#"></a>
  </header>

  <div class="statusbar" id="statusbar"><span class="dot"></span><span id="statusbar-text"></span></div>

  <p class="section-title" id="body-title" style="display:none">작업계획서 상세</p>
  <article class="plan-body" id="plan-body" style="display:none"></article>

  <div id="decisions-wrap">
    <p class="section-title" id="decisions-title">결정 사항 — 선택 후 하단 [프롬프트로 복사]</p>
    <div id="decisions"></div>

    <div class="card" id="notes-card">
      <h3 class="card-title">추가 메모 (선택)</h3>
      <p class="card-desc">결정 외에 전달할 제약·우선순위·주의사항이 있으면 적어주세요.</p>
      <textarea class="notes-area" id="notes" placeholder="예: 커밋 메시지는 영어로 통일"></textarea>
    </div>

    <details class="preview">
      <summary>복사될 프롬프트 미리보기</summary>
      <pre class="prompt-out" id="preview"></pre>
    </details>
  </div>
</div>

<div class="actionbar" id="actionbar">
  <div class="actionbar-inner">
    <div class="status" id="status"></div>
    <button id="btn-json">JSON 복사</button>
    <button class="primary" id="btn-copy">프롬프트로 복사</button>
  </div>
</div>
<div class="toast" id="toast">복사되었습니다</div>

<script>
(function () {
  const state = {}; // decisionId -> { picks: Set, custom: '' }

  const el = (tag, cls, html) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html != null) node.innerHTML = html;
    return node;
  };
  const escapeText = (str) => String(str).replace(/[&<>"]/g, (ch) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // decided 값을 배열로 정규화
  const decidedList = (dec) => {
    if (dec.decided == null) return null;
    return Array.isArray(dec.decided) ? dec.decided : [dec.decided];
  };
  const isConfirmed = (dec) => decidedList(dec) !== null;
  // 모든 필수 결정에 decided 가 채워졌는가 → 확정 모드
  const allConfirmed = () => PLAN.decisions.length > 0 &&
    PLAN.decisions.every((dec) => !dec.required || isConfirmed(dec));

  // --- 헤더 렌더 ---
  document.getElementById('p-title').textContent = PLAN.title;
  document.getElementById('p-summary').textContent = PLAN.summary || '';
  const typeBadge = document.getElementById('p-type');
  typeBadge.textContent = PLAN.type;
  typeBadge.classList.add('type-' + PLAN.type);
  document.getElementById('p-scope').textContent = '영향 범위: ' + PLAN.scope;
  const mdLink = document.getElementById('p-mdlink');
  mdLink.innerHTML = '원본 계획서 → <code>' + escapeText(PLAN.mdFile) + '</code>';
  mdLink.href = PLAN.mdFile.split('/').pop();

  // --- 결정 카드 렌더 ---
  const container = document.getElementById('decisions');
  PLAN.decisions.forEach((dec) => {
    const confirmed = isConfirmed(dec);
    const preset = decidedList(dec) || [];
    state[dec.id] = { picks: new Set(preset), custom: '' };

    const card = el('div', 'card' + (confirmed ? ' confirmed' : ''));
    card.dataset.id = dec.id;
    const reqMark = dec.required ? ' *' : '';
    card.appendChild(el('div', 'card-head',
      '<h3 class="card-title">' + escapeText(dec.title) + reqMark + '</h3>' +
      '<span class="pick-tag">' + (dec.type === 'multi' ? '복수 선택' : '택1') + '</span>'));
    if (dec.desc) card.appendChild(el('p', 'card-desc', escapeText(dec.desc)));

    const opts = el('div', 'options');
    dec.options.forEach((opt) => {
      const row = el('div', 'option');
      row.dataset.type = dec.type;
      if (preset.includes(opt.label)) row.classList.add('selected');
      const rec = opt.recommended ? '<span class="rec">추천</span>' : '';
      const desc = opt.desc ? '<div class="opt-desc">' + escapeText(opt.desc) + '</div>' : '';
      const customField = opt.custom
        ? '<input class="custom-input" placeholder="직접 입력" />' : '';
      row.innerHTML =
        '<div class="marker"></div>' +
        '<div class="opt-body"><div class="opt-label">' + escapeText(opt.label) + rec + '</div>' +
        desc + customField + '</div>';
      if (!confirmed) {
        row.addEventListener('click', (ev) => {
          if (ev.target.classList.contains('custom-input')) return;
          toggle(dec, opt, row, opts);
        });
        const customInput = row.querySelector('.custom-input');
        if (customInput) customInput.addEventListener('input', () => {
          state[dec.id].custom = customInput.value;
          render();
        });
      }
      opts.appendChild(row);
    });
    card.appendChild(opts);
    container.appendChild(card);
  });

  function toggle(dec, opt, row, opts) {
    const picks = state[dec.id].picks;
    if (dec.type === 'single') {
      picks.clear();
      opts.querySelectorAll('.option').forEach((node) => node.classList.remove('selected'));
      picks.add(opt.label);
      row.classList.add('selected');
    } else {
      if (picks.has(opt.label)) { picks.delete(opt.label); row.classList.remove('selected'); }
      else { picks.add(opt.label); row.classList.add('selected'); }
    }
    render();
  }

  // --- 선택 결과 → 텍스트 ---
  function valueFor(dec) {
    const st = state[dec.id];
    const labels = [...st.picks].map((label) => {
      const opt = dec.options.find((option) => option.label === label);
      if (opt && opt.custom && st.custom.trim()) return st.custom.trim();
      return label;
    });
    return labels.join(', ');
  }

  function unresolved() {
    return PLAN.decisions.filter((dec) => dec.required && state[dec.id].picks.size === 0);
  }

  function buildPrompt() {
    const lines = [];
    lines.push('[작업계획서 결정사항 확정] ' + PLAN.title);
    lines.push('');
    lines.push('아래 결정사항으로 ' + PLAN.mdFile + ' 계획서를 확정하고 진행해주세요.');
    lines.push('');
    PLAN.decisions.forEach((dec, idx) => {
      const val = valueFor(dec) || '(미결정)';
      lines.push((idx + 1) + '. ' + dec.title + ': ' + val);
    });
    const notes = document.getElementById('notes').value.trim();
    lines.push('');
    lines.push('추가 메모: ' + (notes || '(없음)'));
    return lines.join('\n');
  }

  function buildJson() {
    const obj = { title: PLAN.title, mdFile: PLAN.mdFile, decisions: {}, notes: document.getElementById('notes').value.trim() };
    PLAN.decisions.forEach((dec) => { obj.decisions[dec.title] = valueFor(dec); });
    return JSON.stringify(obj, null, 2);
  }

  function render() {
    PLAN.decisions.forEach((dec) => {
      const card = container.querySelector('[data-id="' + dec.id + '"]');
      const tag = card.querySelector('.pick-tag');
      const decided = state[dec.id].picks.size > 0;
      card.classList.toggle('unresolved', dec.required && !decided && !isConfirmed(dec));
      if (decided) {
        tag.classList.add('done');
        tag.textContent = (isConfirmed(dec) ? '✅ 확정 · ' : '✓ ') + valueFor(dec);
      } else {
        tag.classList.remove('done');
        tag.textContent = dec.type === 'multi' ? '복수 선택' : '택1';
      }
    });
    const left = unresolved();
    const status = document.getElementById('status');
    if (left.length === 0) status.innerHTML = '<b>모든 필수 결정 완료.</b> 복사해서 채팅에 붙여넣으세요.';
    else status.innerHTML = '필수 결정 <b>' + left.length + '개</b> 남음: ' +
      left.map((dec) => escapeText(dec.title)).join(', ');
    document.getElementById('btn-copy').disabled = left.length > 0;
    document.getElementById('preview').textContent = buildPrompt();
  }

  // --- 라이프사이클 UI: 결정 콘솔 / 확정 뷰 전환 ---
  function applyLifecycle() {
    const confirmed = allConfirmed();
    const bar = document.getElementById('statusbar');
    const barText = document.getElementById('statusbar-text');
    if (confirmed) {
      bar.className = 'statusbar confirmed';
      barText.textContent = '✅ 확정 완료 — 아래는 확정된 작업계획서입니다. (결정 카드는 잠금 표시)';
      document.getElementById('decisions-title').textContent = '확정된 결정 사항';
      // 확정되면 메모 입력/미리보기/액션바는 감춰 읽기용으로 전환
      document.getElementById('notes-card').style.display = 'none';
      document.querySelector('details.preview').style.display = 'none';
      document.getElementById('actionbar').style.display = 'none';
      document.querySelector('.wrap').style.paddingBottom = '60px';
    } else {
      bar.className = 'statusbar pending';
      const left = PLAN.decisions.filter((dec) => dec.required && !isConfirmed(dec)).length;
      barText.textContent = '결정 대기 — 필수 ' + left + '건을 선택해 [프롬프트로 복사] 후 채팅에 붙여넣어 주세요.';
    }
  }

  // --- .md 본문 렌더 ---
  renderPlanBody();
  function renderPlanBody() {
    const raw = (document.getElementById('plan-md').textContent || '').trim();
    if (!raw) return;
    document.getElementById('body-title').style.display = '';
    const body = document.getElementById('plan-body');
    body.style.display = '';
    body.innerHTML = miniMarkdown(raw);
  }

  // 의존성 없는 경량 마크다운 렌더러 (중첩목록 미지원)
  function mdEscape(str) {
    return String(str).replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
  }
  function mdInline(str) {
    let out = mdEscape(str);
    out = out.replace(/`([^`]+)`/g, (m, code) => '<code>' + code + '</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
    return out;
  }
  function mdSplitRow(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim());
  }
  function miniMarkdown(src) {
    const lines = src.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let idx = 0;
    const isSpecial = (line) =>
      /^(#{1,6})\s/.test(line) || /^```/.test(line) || /^\s*\|.*\|\s*$/.test(line) ||
      /^\s*([-*])\s+/.test(line) || /^\s*\d+\.\s+/.test(line) || /^\s*---+\s*$/.test(line) ||
      /^\s*>/.test(line) || /^\s*$/.test(line);

    while (idx < lines.length) {
      const line = lines[idx];

      // 코드 펜스
      if (/^```/.test(line)) {
        idx += 1;
        const buf = [];
        while (idx < lines.length && !/^```/.test(lines[idx])) { buf.push(lines[idx]); idx += 1; }
        idx += 1;
        html += '<pre class="md-code"><code>' + mdEscape(buf.join('\n')) + '</code></pre>';
        continue;
      }
      // 표 (헤더 + 구분선)
      if (/^\s*\|.*\|\s*$/.test(line) && idx + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[idx + 1])) {
        const header = mdSplitRow(line);
        idx += 2;
        const rows = [];
        while (idx < lines.length && /^\s*\|.*\|\s*$/.test(lines[idx])) { rows.push(mdSplitRow(lines[idx])); idx += 1; }
        html += '<table><thead><tr>' + header.map((cell) => '<th>' + mdInline(cell) + '</th>').join('') + '</tr></thead><tbody>';
        html += rows.map((row) => '<tr>' + row.map((cell) => '<td>' + mdInline(cell) + '</td>').join('') + '</tr>').join('');
        html += '</tbody></table>';
        continue;
      }
      // 제목
      const heading = line.match(/^(#{1,6})\s+(.*)$/);
      if (heading) {
        const level = heading[1].length;
        html += '<h' + level + '>' + mdInline(heading[2]) + '</h' + level + '>';
        idx += 1;
        continue;
      }
      // 구분선
      if (/^\s*---+\s*$/.test(line)) { html += '<hr>'; idx += 1; continue; }
      // 인용
      if (/^\s*>\s?/.test(line)) {
        const buf = [];
        while (idx < lines.length && /^\s*>\s?/.test(lines[idx])) { buf.push(lines[idx].replace(/^\s*>\s?/, '')); idx += 1; }
        html += '<blockquote>' + mdInline(buf.join(' ')) + '</blockquote>';
        continue;
      }
      // 목록
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\.\s+/.test(line);
        const buf = [];
        while (idx < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[idx])) {
          buf.push(lines[idx].replace(/^\s*([-*]|\d+\.)\s+/, '')); idx += 1;
        }
        const items = buf.map((item) => '<li>' + mdInline(item) + '</li>').join('');
        html += ordered ? '<ol>' + items + '</ol>' : '<ul>' + items + '</ul>';
        continue;
      }
      // 빈 줄
      if (/^\s*$/.test(line)) { idx += 1; continue; }
      // 문단
      const buf = [line];
      idx += 1;
      while (idx < lines.length && !isSpecial(lines[idx])) { buf.push(lines[idx]); idx += 1; }
      html += '<p>' + mdInline(buf.join(' ')) + '</p>';
    }
    return html;
  }

  function copy(text) {
    navigator.clipboard.writeText(text).then(showToast).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); showToast();
    });
  }
  let toastTimer;
  function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  document.getElementById('btn-copy').addEventListener('click', () => copy(buildPrompt()));
  document.getElementById('btn-json').addEventListener('click', () => copy(buildJson()));
  document.getElementById('notes').addEventListener('input', render);

  render();
  applyLifecycle();
})();
</script>
</body>
